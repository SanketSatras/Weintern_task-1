<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sanket Satras">
    <title>Contact | Sanket Satras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
            margin-top: 3rem;
        }

        .contact-info h3 {
            margin-bottom: 1.5rem;
        }

        .info-item {
            margin-bottom: 1.5rem;
        }

        .info-item h4 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-item p,
        .info-item a {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .info-item a:hover {
            color: var(--accent-color);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 150px;
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="glass-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">SANKET.</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <div class="controls">
                <button id="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="section-pad animate-on-scroll">
            <div class="container">
                <h1 class="section-title">Get In <span class="gradient-text">Touch</span></h1>

                <div class="contact-grid">
                    <div class="contact-info glass-card">
                        <h3>Contact Information</h3>

                        <div class="info-item">
                            <h4>Email</h4>
                            <a href="mailto:Sanketsatras5055@gmail.com">Sanketsatras5055@gmail.com</a>
                        </div>

                        <div class="info-item">
                            <h4>Location</h4>
                            <p>Pune,Maharashtra</p>
                        </div>

                        <div class="info-item">
                            <h4>Socials</h4>
                            <div class="social-links" style="margin-top: 0.5rem;">
                                <a href="https://github.com/SanketSatras/" aria-label="GitHub">GitHub</a>
                                <a href="https://www.linkedin.com/in/sanket-satras-a10023286"
                                    aria-label="LinkedIn">LinkedIn</a>
                            </div>
                        </div>
                    </div>

                    <div class="contact-form-container glass-card">
                        <form class="contact-form" action="#" method="POST"
                            onsubmit="event.preventDefault(); alert('Form submission simulated!');">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" class="form-control" required
                                    placeholder="SanketSatras">
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" class="form-control" required
                                    placeholder="Sanketsatras5055@gmail.com">
                            </div>

                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" class="form-control" required
                                    placeholder="How can I help you?"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Send
                                Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Sanket Satras. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/SanketSatras/" aria-label="GitHub">GitHub</a>
                <a href="https://www.linkedin.com/in/sanket-satras-a10023286" aria-label="LinkedIn">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
